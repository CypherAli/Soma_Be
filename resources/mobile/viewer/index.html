<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Soma Atlas</title>
    <style>
      html,
      body,
      #stage {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        background: #f1f3f5;
        color: #17202e;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
        pointer-events: none;
        background: inherit;
      }
      #status[hidden] {
        display: none;
      }
      #status strong {
        font-weight: 500;
      }
      #status p {
        color: #667180;
        font-size: 12px;
        margin-top: 8px;
      }
      #status.error {
        background: #f1f3f5;
        color: #9c302e;
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-label="Mô hình giải phẫu 3D tương tác"></div>
    <div id="status" role="status">
      <strong>Đang tải mô hình…</strong>
      <p>Kéo để xoay · Chụm hai ngón để phóng to</p>
    </div>
    <script>
      /*__SOMA_CONFIG__*/
    </script>
    <script type="module" src="../runtime/viewer.js?v=49fc52873a25839f"></script>
  </body>
</html>
